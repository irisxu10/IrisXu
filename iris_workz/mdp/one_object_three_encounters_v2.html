/* ======================= src/ui/ExhibitionUI.js ======================= */
const M_ui_ExhibitionUI = (() => {
  // Participant-facing interface: language, progressive hints, info panel,
  // optional reflection. Contains no simulation logic.

  const { t, translations } = M_ui_translations;

  const HINT_FIRST_DELAY = 900;
  const TOUCH_HINT_DELAY = 2500;
  const WAIT_HINT_STILL = 2000;
  const HINT_MAX_AGE = { approach: Infinity, touch: 8000, wait: 6000 };

  class ExhibitionUI {
    constructor({ lang = 'en', onLangChange, onReset, onFinish, onReflection, onOpenResearcher, onSound }) {
      this.lang = lang;
      this.sound = 'off';
      this.cb = { onLangChange, onReset, onFinish, onReflection, onOpenResearcher, onSound };
      this.$ = (id) => document.getElementById(id);
      this.hintEl = this.$('hint');
      this.info = this.$('info');
      this.reflection = this.$('reflection');
      this.lastFocus = null;
      this.buildQuestions();
      this.bind();
      this.resetHints();
      this.applyLanguage();
    }

    bind() {
      this.$('langBtn').addEventListener('click', () => {
        this.lang = this.lang === 'en' ? 'zh' : 'en';
        this.applyLanguage();
        this.cb.onLangChange?.(this.lang);
      });
      this.$('soundBtn').addEventListener('click', () => this.cb.onSound?.());
      this.$('infoBtn').addEventListener('click', () => this.togglePanel(this.info, this.$('infoBtn')));
      this.$('infoClose').addEventListener('click', () => this.closePanel(this.info));
      this.$('openResearcher').addEventListener('click', () => { this.closePanel(this.info); this.cb.onOpenResearcher?.(); });
      this.$('resetBtn').addEventListener('click', () => { this.closePanel(this.reflection); this.cb.onReset?.(); });
      this.$('finishBtn').addEventListener('click', () => this.openReflection());
      this.$('reflectSkip').addEventListener('click', () => this.submitReflection(null));
      this.$('reflectForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const answers = {};
        this.reflection.querySelectorAll('textarea').forEach((ta, i) => { answers['q' + (i + 1)] = ta.value.trim(); });
        this.submitReflection(answers);
      });
      this.$('reflectContinue').addEventListener('click', () => this.closePanel(this.reflection));
    }

    buildQuestions() {
      const wrap = this.$('questions');
      const n = translations.en.questions.length;
      for (let i = 0; i < n; i++) {
        const id = 'q' + (i + 1);
        const label = document.createElement('label');
        label.htmlFor = id;
        label.dataset.i18n = `questions.${i}`;
        const ta = document.createElement('textarea');
        ta.id = id; ta.rows = 2;
        wrap.append(label, ta);
      }
    }

    applyLanguage() {
      const L = this.lang;
      document.documentElement.lang = L === 'zh' ? 'zh-CN' : 'en';
      document.title = t(L, 'docTitle');
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(L, el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(L, el.dataset.i18nAria)); });
      this.$('langEn').classList.toggle('on', L === 'en');
      this.$('langZh').classList.toggle('on', L === 'zh');
      this.$('langBtn').setAttribute('aria-label', L === 'en' ? '切换到中文' : 'Switch to English');
      if (this.hint) this.hintEl.textContent = t(L, 'hints.' + this.hint);
      this.renderSound();
    }

    /** state: 'on' | 'off' | 'unavailable' */
    setSound(state) { this.sound = state; this.renderSound(); }

    renderSound() {
      const btn = this.$('soundBtn');
      const key = this.sound === 'on' ? 'soundOn' : this.sound === 'unavailable' ? 'soundUnavailable' : 'soundOff';
      btn.textContent = t(this.lang, key);
      btn.setAttribute('aria-pressed', String(this.sound === 'on'));
      btn.disabled = this.sound === 'unavailable';
    }

    // ---------- hints ----------
    resetHints() {
      this.hint = null; this.hintAge = 0; this.elapsed = 0;
      this.seen = { approach: false, touch: false, wait: false };
      this.approachedAt = null;
      this.hintEl.classList.remove('visible');
    }

    showHint(key) {
      this.hint = key; this.hintAge = 0; this.seen[key] = true;
      this.hintEl.textContent = t(this.lang, 'hints.' + key);
      this.hintEl.classList.add('visible');
    }

    hideHint() { this.hint = null; this.hintEl.classList.remove('visible'); }

    update(sim, dtMs) {
      this.elapsed += dtMs;
      const tot = sim.totals, near = sim.proximity > 0.3;
      if (near && this.approachedAt === null) { this.approachedAt = this.elapsed; this.seen.approach = true; }
      if (this.hint) {
        this.hintAge += dtMs;
        const done = (this.hint === 'approach' && near)
          || (this.hint === 'touch' && tot.contactEpisodes > 0)
          || this.hintAge > HINT_MAX_AGE[this.hint];
        if (done) this.hideHint();
        return;
      }
      if (!this.seen.approach && this.elapsed > HINT_FIRST_DELAY && tot.contactEpisodes === 0) this.showHint('approach');
      else if (!this.seen.touch && this.approachedAt !== null && tot.contactEpisodes === 0 && this.elapsed - this.approachedAt > TOUCH_HINT_DELAY) this.showHint('touch');
      else if (!this.seen.wait && tot.contactEpisodes >= 3 && !sim.grab && sim.stillMs > WAIT_HINT_STILL) this.showHint('wait');
    }

    // ---------- panels ----------
    anyPanelOpen() { return !this.info.hidden || !this.reflection.hidden; }

    togglePanel(panel, opener) { if (panel.hidden) this.openPanel(panel, opener); else this.closePanel(panel); }

    openPanel(panel, opener = document.activeElement) {
      this.lastFocus = opener;
      panel.hidden = false;
      if (panel === this.info) this.$('infoBtn').setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => panel.classList.add('open'));
      panel.querySelector('button, textarea, [tabindex]')?.focus();
    }

    closePanel(panel) {
      if (panel.hidden) return;
      panel.classList.remove('open');
      panel.hidden = true;
      if (panel === this.info) this.$('infoBtn').setAttribute('aria-expanded', 'false');
      this.lastFocus?.focus?.();
    }

    closeAll() { this.closePanel(this.info); this.closePanel(this.reflection); }

    openReflection() {
      this.closePanel(this.info);
      this.$('reflectForm').hidden = false;
      this.$('reflectThanks').hidden = true;
      this.cb.onFinish?.();
      this.openPanel(this.reflection, this.$('finishBtn'));
    }

    submitReflection(answers) {
      this.cb.onReflection?.(answers);
      this.$('reflectForm').hidden = true;
      this.$('reflectThanks').hidden = false;
      this.$('reflectContinue').focus();
    }

    clearReflection() { this.reflection.querySelectorAll('textarea').forEach((ta) => { ta.value = ''; }); }
  }
  return { ExhibitionUI };
})();

/* ======================= src/ui/ResearcherPanel.js ======================= */
const M_ui_ResearcherPanel = (() => {
  // Researcher Mode: hidden during ordinary encounters. Builds its own DOM.

  const { RESEARCH_SLIDERS, RESEARCH_TOGGLES, VISUAL_SLIDERS } = M_config;
  const { t } = M_ui_translations;

  const UPDATE_INTERVAL = 200; // ms

  class ResearcherPanel {
    constructor(root, { getLang, onParam, onVisual, onPreset, onSeed, onReset, onExport }) {
      this.root = root;
      this.cb = { getLang, onParam, onVisual, onPreset, onSeed, onReset, onExport };
      this.sinceUpdate = UPDATE_INTERVAL;
      this.build();
    }

    get open() { return !this.root.hidden; }

    toggle() { if (this.open) this.close(); else this.show(); }
    show() { this.root.hidden = false; this.sinceUpdate = UPDATE_INTERVAL; this.root.querySelector('button')?.focus(); }
    close() { this.root.hidden = true; }

    L(key) { return t(this.cb.getLang(), 'researcher.' + key); }

    build() {
      const r = this.root;
      r.innerHTML = '';
      const el = (tag, attrs = {}, ...kids) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
        }
        e.append(...kids);
        return e;
      };
      this.el = el;

      r.append(el('div', { class: 'r-head' },
        el('h2', { id: 'r-title' }, this.L('title')),
        el('button', { type: 'button', onclick: () => this.close(), 'aria-label': this.L('close') }, '×')));

      // condition + presets
      this.condEl = el('strong');
      r.append(el('section', {},
        el('div', { class: 'r-row' }, el('span', {}, this.L('condition')), this.condEl),
        el('div', { class: 'r-presets' },
          el('button', { type: 'button', onclick: () => this.cb.onPreset('A') }, this.L('presetA')),
          el('button', { type: 'button', onclick: () => this.cb.onPreset('B') }, this.L('presetB'))),
        el('p', { class: 'r-note' }, this.L('presetNote'))));

      // seed
      this.seedInput = el('input', { type: 'number', min: '0', step: '1', id: 'r-seed' });
      r.append(el('section', {}, el('label', { for: 'r-seed' }, this.L('seed')),
        el('div', { class: 'r-seed' }, this.seedInput,
          el('button', { type: 'button', onclick: () => {
            const v = Math.floor(Number(this.seedInput.value));
            if (Number.isFinite(v) && v >= 0) this.cb.onSeed(v >>> 0);
          } }, this.L('applySeed')))));

      // sliders
      this.inputs = {};
      const sliders = el('section', {});
      for (const s of RESEARCH_SLIDERS) {
        const id = 'r-' + s.key;
        const out = el('output', { for: id });
        const input = el('input', { type: 'range', id, min: s.min, max: s.max, step: s.step });
        input.addEventListener('input', () => { out.textContent = input.value; });
        input.addEventListener('change', () => this.cb.onParam(s.key, Number(input.value)));
        this.inputs[s.key] = { input, out };
        sliders.append(el('div', { class: 'r-slider' },
          el('label', { for: id }, el('span', {}, this.L('params.' + s.key)), out), input));
      }
      for (const key of RESEARCH_TOGGLES) {
        const id = 'r-' + key;
        const input = el('input', { type: 'checkbox', id });
        input.addEventListener('change', () => this.cb.onParam(key, input.checked));
        this.inputs[key] = { input };
        sliders.append(el('label', { class: 'r-check', for: id }, input, el('span', {}, this.L('params.' + key))));
      }
      r.append(sliders);

      // display-only settings (scope "visual")
      this.visualInputs = {};
      const vis = el('section', {}, el('h3', {}, this.L('visualTitle')));
      for (const s of VISUAL_SLIDERS) {
        const id = 'r-v-' + s.key;
        const out = el('output', { for: id });
        const input = el('input', { type: 'range', id, min: s.min, max: s.max, step: s.step });
        input.addEventListener('input', () => { out.textContent = input.value; this.cb.onVisual(s.key, Number(input.value), false); });
        input.addEventListener('change', () => this.cb.onVisual(s.key, Number(input.value), true));
        this.visualInputs[s.key] = { input, out };
        vis.append(el('div', { class: 'r-slider' }, el('label', { for: id }, el('span', {}, this.L('params.' + s.key)), out), input));
      }
      const low = el('input', { type: 'checkbox', id: 'r-v-lowDetail' });
      low.addEventListener('change', () => this.cb.onVisual('lowDetail', low.checked, true));
      this.visualInputs.lowDetail = { input: low };
      vis.append(el('label', { class: 'r-check', for: 'r-v-lowDetail' }, low, el('span', {}, this.L('lowDetail'))));
      r.append(vis);

      // live state
      this.stateEl = el('div', { class: 'r-state' });
      this.statsEl = el('dl', { class: 'r-stats' });
      this.heat = el('canvas', { width: '360', height: '360', class: 'r-heat', 'aria-hidden': 'true' });
      r.append(el('section', {}, el('h3', {}, this.L('state')), this.stateEl, this.statsEl,
        el('h3', {}, this.L('heatmap')), this.heat));

      r.append(el('section', { class: 'r-actions' },
        el('button', { type: 'button', onclick: () => this.cb.onReset() }, this.L('reset')),
        el('button', { type: 'button', class: 'primary', onclick: () => this.cb.onExport() }, this.L('export'))));
    }

    /** Re-render labels after a language change, keeping values. */
    relabel(sim, conditionId, visual) {
      const wasOpen = this.open;
      this.build();
      this.sync(sim, conditionId, visual);
      this.root.hidden = !wasOpen;
    }

    sync(sim, conditionId, visual) {
      for (const [key, { input, out }] of Object.entries(this.inputs)) {
        if (input.type === 'checkbox') input.checked = !!sim.params[key];
        else { input.value = sim.params[key]; out.textContent = sim.params[key]; }
      }
      this.seedInput.value = sim.seed;
      this.condEl.textContent = conditionId;
      for (const [key, { input, out }] of Object.entries(this.visualInputs)) {
        if (input.type === 'checkbox') input.checked = !!visual[key];
        else { input.value = visual[key]; out.textContent = visual[key]; }
      }
    }

    update(sim, fps, dtMs, eventCount, extra = {}) {
      if (!this.open) return;
      this.sinceUpdate += dtMs;
      if (this.sinceUpdate < UPDATE_INTERVAL) return;
      this.sinceUpdate = 0;
      const st = sim.getState();
      this.stateEl.textContent = st.primary + '  ·  ' + Object.entries(st.flags).filter(([, v]) => v).map(([k]) => k).join(' + ');
      const tot = sim.totals;
      const rows = [
        ['elapsed', (sim.timeMs / 1000).toFixed(1) + 's'],
        ['contacts', tot.contactEpisodes],
        ['revisits', tot.revisits],
        ['adapted', sim.adapt.adaptedRegions() + ' / ' + sim.regionCount],
        ['sweeps', tot.sweeps],
        ['dwells', tot.dwells],
        ['maxMemory', sim.memory.max().toFixed(2)],
        ['events', eventCount],
        ['fps', Math.round(fps) + (extra.detail < 1 ? ' · ' + this.L('detailAuto') + ' ' + extra.detail : '')],
      ];
      if (extra.audioPeak !== undefined) rows.push(['audioPeak', extra.audioPeak]);
      this.statsEl.replaceChildren(...rows.flatMap(([k, v]) => [this.el('dt', {}, k === 'audioPeak' ? this.L('audioPeak') : this.L('stats.' + k)), this.el('dd', {}, String(v))]));
      this.drawHeat(sim);
    }

    drawHeat(sim) {
      const c = this.heat, ctx = c.getContext('2d'), W = c.width, cx = W / 2;
      const ink = getComputedStyle(this.root).color;
      ctx.clearRect(0, 0, W, W);
      const n = sim.n, step = (Math.PI * 2) / n;
      for (let i = 0; i < n; i++) {
        const a0 = i * step - step / 2, a1 = a0 + step;
        ctx.beginPath(); ctx.arc(cx, cx, W * 0.44, a0, a1); ctx.arc(cx, cx, W * 0.32, a1, a0, true); ctx.closePath();
        ctx.fillStyle = `rgba(199,233,255,${0.06 + sim.memory.level[i] * 0.9})`; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cx, W * 0.3, a0, a1); ctx.arc(cx, cx, W * 0.2, a1, a0, true); ctx.closePath();
        ctx.fillStyle = `rgba(117,189,232,${0.06 + sim.adapt.level[i] * 0.9})`; ctx.fill();
      }
      ctx.strokeStyle = ink; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
      for (let r = 0; r < sim.regionCount; r++) {
        const a = (r - 0.5) * (Math.PI * 2 / sim.regionCount);
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * W * 0.2, cx + Math.sin(a) * W * 0.2);
        ctx.lineTo(cx + Math.cos(a) * W * 0.46, cx + Math.sin(a) * W * 0.46); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  return { ResearcherPanel };
})();

// Module namespace (read-only use: console inspection and headless tests)
globalThis.OOME = Object.freeze({ M_config, M_util_math, M_physics_SoftBody, M_behavior_MemorySystem, M_behavior_AdaptationSystem, M_behavior_ImmediateResponse, M_simulation_Simulation, M_rendering_FilamentNetwork, M_rendering_FilamentRenderer, M_interaction_PointerController, M_audio_AudioEngine, M_research_SessionLogger, M_research_Exporter, M_ui_translations, M_ui_ExhibitionUI, M_ui_ResearcherPanel });

/* ======================= src/main.js ======================= */
// Only runs in a browser page that has the stage canvas (lets tests load the modules headlessly).
if (typeof document !== 'undefined' && document.getElementById('stage')) {
  // Entry point: wires simulation, renderer, input, sound, UI and research tools.

  const { APP_VERSION, STEP, MAX_SUBSTEPS, DEFAULT_PARAMS, PRESETS, DEFAULT_VISUAL } = M_config;
  const { Simulation } = M_simulation_Simulation;
  const { FilamentRenderer } = M_rendering_FilamentRenderer;
  const { PointerController } = M_interaction_PointerController;
  const { AudioEngine } = M_audio_AudioEngine;
  const { SessionLogger } = M_research_SessionLogger;
  const { buildPayload, downloadJSON } = M_research_Exporter;
  const { ExhibitionUI } = M_ui_ExhibitionUI;
  const { ResearcherPanel } = M_ui_ResearcherPanel;

  const canvas = document.getElementById('stage');
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');

  const logger = new SessionLogger();
  const sim = new Simulation({ logger, reducedMotion: motionQuery.matches });
  const renderer = new FilamentRenderer(canvas, sim);
  renderer.reducedMotion = motionQuery.matches;
  const pointer = new PointerController(canvas, (x, y) => renderer.toObject(x, y));
  const audio = new AudioEngine();
  sim.hooks.contact = (s) => audio.contact(s);
  sim.hooks.release = (t) => audio.release(t);

  let lang = 'en';
  const visual = renderer.visual;
  const condition = { preset: 'B', custom: false };
  const conditionId = () => PRESETS[condition.preset].id + (condition.custom ? '+custom' : '');

  function startSession() {
    sim.reset(sim.seed);
    renderer.resetLag();
    logger.start({
      appVersion: APP_VERSION,
      condition: conditionId(),
      seed: sim.seed,
      parameters: { ...sim.params },
      visualParameters: { ...visual },
      reducedMotion: sim.reducedMotion,
      sound: audio.enabled,
    });
    ui.resetHints();
    ui.clearReflection();
  }

  function logParam(param, from, to, scope = 'behaviour') {
    logger.log('parameter_change', sim.timeMs, { metadata: { param, from, to, scope } });
  }

  const ui = new ExhibitionUI({
    lang,
    onLangChange: (l) => { lang = l; researcher.relabel(sim, conditionId(), visual); },
    onReset: () => startSession(),
    onReflection: (answers) => logger.setReflection(answers, sim.timeMs),
    onOpenResearcher: () => researcher.show(),
    onSound: async () => {
      if (audio.enabled) audio.disable();
      else if (!(await audio.enable())) { ui.setSound('unavailable'); return; }
      ui.setSound(audio.enabled ? 'on' : 'off');
      logger.log('sound_toggle', sim.timeMs, { metadata: { enabled: audio.enabled } });
    },
  });
  ui.setSound(audio.supported ? 'off' : 'unavailable');

  const researcher = new ResearcherPanel(document.getElementById('researcher'), {
    getLang: () => lang,
    onParam: (key, value) => {
      const from = sim.params[key];
      if (from === value) return;
      sim.params[key] = value;
      condition.custom = true;
      logParam(key, from, value);
      researcher.sync(sim, conditionId(), visual);
    },
    // display-only: applied live while dragging a slider, logged on commit; never marks the condition custom
    onVisual: (key, value, commit) => {
      const from = visual[key];
      if (!commit) { renderer.setVisual(key, value); return; }
      if (visualCommitted[key] !== value) logParam(key, visualCommitted[key], value, 'visual');
      visualCommitted[key] = value;
      if (from !== value) renderer.setVisual(key, value);
    },
    onPreset: (id) => {
      const { id: _ignored, ...flags } = PRESETS[id];
      logParam('preset', conditionId(), PRESETS[id].id);
      Object.assign(sim.params, DEFAULT_PARAMS, flags);
      condition.preset = id; condition.custom = false;
      startSession();
      researcher.sync(sim, conditionId(), visual);
    },
    onSeed: (seed) => {
      logParam('seed', sim.seed, seed);
      sim.seed = seed;
      startSession();
      researcher.sync(sim, conditionId(), visual);
    },
    onReset: () => { startSession(); researcher.sync(sim, conditionId(), visual); },
    onExport: () => downloadJSON(buildPayload(sim, logger, { condition: conditionId(), visual })),
  });
  const visualCommitted = { ...DEFAULT_VISUAL };

  startSession();
  researcher.sync(sim, conditionId(), visual);

  // ---------- global input ----------
  addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === 'Escape') { if (researcher.open) researcher.close(); else ui.closeAll(); }
    else if (!typing && e.shiftKey && (e.key === 'R' || e.key === 'r')) { e.preventDefault(); researcher.toggle(); }
  });

  new ResizeObserver(() => renderer.resize()).observe(canvas);
  motionQuery.addEventListener?.('change', (e) => { sim.reducedMotion = e.matches; renderer.reducedMotion = e.matches; });

  // ---------- loop ----------
  let last = performance.now(), acc = 0, fps = 60, slowMs = 0;
  document.addEventListener('visibilitychange', () => {
    audio.setHidden(document.hidden);
    if (!document.hidden) last = performance.now();
  });

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    if (dt > 0) fps += (1 / dt - fps) * 0.05;
    acc += dt;
    pointer.update(now);
    sim.setInput(pointer.state);
    let steps = 0;
    while (acc >= STEP && steps < MAX_SUBSTEPS) { sim.step(); acc -= STEP; steps++; }
    if (steps === MAX_SUBSTEPS) acc = 0; // drop backlog instead of spiralling

    // automatic reduced-detail fallback after sustained low frame rate
    slowMs = fps < 40 ? slowMs + dt * 1000 : 0;
    if (slowMs > 2500 && renderer.detail === 1) {
      renderer.detail = 0.6;
      logParam('autoDetail', 1, 0.6, 'visual');
    }

    renderer.draw(dt, pointer.state);
    audio.update(sim.signals, !!sim.grab);
    ui.update(sim, dt * 1000);
    researcher.update(sim, fps, dt * 1000, logger.events.length, {
      detail: renderer.detail,
      audioPeak: audio.enabled ? audio.peak.toFixed(3) : undefined,
    });
  }
  requestAnimationFrame(frame);

  // exposed for manual inspection in the console (read-only use)
  window.__oome = { sim, logger, renderer, audio, version: APP_VERSION };
  window.__oomeReady = true;
  document.getElementById('boot-warning')?.remove();
}
  </script>
